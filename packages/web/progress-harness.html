<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sketch progress preview</title>
    <style>
      :root {
        --background: oklch(0.976 0.003 107.2);
        --foreground: oklch(0.107 0 0);
        --muted: oklch(0.94 0 0);
        --muted-foreground: oklch(0.499 0.005 106.8);
        --border: oklch(0.872 0.003 107.1);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 40px;
      }
      .stage { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
      .row { display: flex; align-items: flex-start; gap: 12px; }
      .avatar {
        width: 24px; height: 24px; flex: 0 0 auto; border-radius: 6px;
        background: var(--foreground); opacity: 0.9;
        animation: sketch-icon-thinking 1.4s ease-in-out infinite;
      }
      .body { flex: 1 1 auto; min-width: 0; font-size: 14px; line-height: 1.7; }

      /* progress block */
      .progress { display: flex; flex-direction: column; gap: 2px; }
      .item { display: flex; align-items: center; gap: 9px; padding: 3px 0; min-width: 0; }
      .icon-chip {
        width: 20px; height: 20px; flex: 0 0 auto; border-radius: 6px;
        background: color-mix(in oklch, var(--muted) 60%, transparent);
        color: color-mix(in oklch, var(--muted-foreground) 90%, transparent);
        display: flex; align-items: center; justify-content: center;
      }
      .icon-chip svg { width: 13px; height: 13px; }
      .item-text { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1 1 auto; }
      .label { font-size: 13px; font-weight: 500; line-height: 1.5; flex: 0 0 auto; }
      .secondary {
        font-size: 12px; line-height: 1.5;
        color: color-mix(in oklch, var(--muted-foreground) 65%, transparent);
        min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .label-static { color: color-mix(in oklch, var(--foreground) 80%, transparent); }

      .shimmer {
        background-image: linear-gradient(
          100deg,
          color-mix(in oklch, var(--muted-foreground) 42%, transparent) 0%,
          color-mix(in oklch, var(--muted-foreground) 42%, transparent) 30%,
          var(--foreground) 48%,
          var(--foreground) 52%,
          color-mix(in oklch, var(--muted-foreground) 42%, transparent) 70%,
          color-mix(in oklch, var(--muted-foreground) 42%, transparent) 100%
        );
        background-size: 220% auto;
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        animation: sketch-shimmer-text 1.8s linear infinite;
      }
      @keyframes sketch-shimmer-text {
        0% { background-position: 220% center; }
        100% { background-position: -120% center; }
      }
      @keyframes sketch-icon-thinking {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.06); }
      }
      .caption { font-size: 11px; color: color-mix(in oklch, var(--muted-foreground) 70%, transparent); margin: 24px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="caption">Thinking (idle)</div>
      <div class="row">
        <div class="avatar"></div>
        <div class="body"><span class="shimmer label">Thinking…</span></div>
      </div>

      <div class="caption">Live tool / skill / canvas progress (active)</div>
      <div class="row">
        <div class="avatar"></div>
        <div class="body">
          <div class="progress" id="progress"></div>
        </div>
      </div>
    </div>

    <script>
      const I = {
        magnifier: '<path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/>',
        globe: '<path d="M128,24a104,104,0,1,0,104,104A104.11,104.11,0,0,0,128,24Zm88,104a87.61,87.61,0,0,1-3.33,24H174.16a157.44,157.44,0,0,0,0-48h39.18A87.61,87.61,0,0,1,216,128ZM102,168H154a115.11,115.11,0,0,1-26,45A115.27,115.27,0,0,1,102,168Zm-3.9-16a140.84,140.84,0,0,1,0-48h59.88a140.84,140.84,0,0,1,0,48ZM40,128a87.61,87.61,0,0,1,3.33-24H82.51a157.44,157.44,0,0,0,0,48H43.33A87.61,87.61,0,0,1,40,128ZM154,88H102a115.11,115.11,0,0,1,26-45A115.27,115.27,0,0,1,154,88Zm52.33,0H170.71a135.28,135.28,0,0,0-22.3-45.6A88.29,88.29,0,0,1,206.37,88ZM107.59,42.4A135.28,135.28,0,0,0,85.29,88H49.63A88.29,88.29,0,0,1,107.59,42.4ZM49.63,168H85.29a135.28,135.28,0,0,0,22.3,45.6A88.29,88.29,0,0,1,49.63,168Zm98.78,45.6a135.28,135.28,0,0,0,22.3-45.6h35.66A88.29,88.29,0,0,1,148.41,213.6Z"/>',
        terminal: '<path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,160H40V56H216V200ZM117.31,134l-40,32a8,8,0,0,1-10-12.49L99.39,128,67.32,102.49a8,8,0,1,1,10-12.49l40,32a8,8,0,0,1,0,12.49ZM176,168H128a8,8,0,0,1,0-16h48a8,8,0,0,1,0,16Z"/>',
        skill: '<path d="M251.76,88.94l-120-64a8,8,0,0,0-7.52,0l-120,64a8,8,0,0,0,0,14.12L32,117.87v48.42a15.91,15.91,0,0,0,4.06,10.65C49.16,191.53,78.43,216,128,216a130,130,0,0,0,48-8.76V240a8,8,0,0,0,16,0V199.51a115.63,115.63,0,0,0,27.94-22.57A15.91,15.91,0,0,0,224,166.29V117.87l27.76-14.81a8,8,0,0,0,0-14.12ZM128,200c-43.27,0-68.72-21.14-80-33.71V126.4l76.24,40.66a8,8,0,0,0,7.52,0L176,143.47v46.34C163.4,195.69,147.52,200,128,200Zm80-33.75a97.83,97.83,0,0,1-16,14.25V134.93l16-8.53ZM188,118.94l-.22-.13-56-29.87a8,8,0,0,0-7.52,14.12L171,128l-43,22.93L25,96,128,41.07,231,96Z"/>',
        canvas: '<path d="M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z"/>',
        file: '<path d="M213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88A8,8,0,0,0,213.66,82.34ZM160,51.31,188.69,80H160ZM200,216H56V40h88V88a8,8,0,0,0,8,8h48V216Z"/>'
      };
      const chip = (svg) => '<span class="icon-chip"><svg viewBox="0 0 256 256" fill="currentColor">' + svg + '</svg></span>';
      const item = (svg, label, secondary) =>
        '<div class="item">' + chip(svg) +
        '<span class="item-text"><span class="label shimmer">' + label + '</span>' +
        (secondary ? '<span class="secondary">' + secondary + '</span>' : '') +
        '</span></div>';
      const rows = [
        item(I.globe, 'Searching the web', '"best espresso machines 2026"'),
        item(I.file, 'Reading', 'data/workspaces/notes.md'),
        item(I.terminal, 'Running', 'pnpm test --filter web'),
        item(I.skill, 'Loading skill', 'research'),
        item(I.canvas, 'Canvas action', 'gmail send-email'),
        item(I.magnifier, 'SearchEntities', '"acme corp"')
      ];
      document.getElementById('progress').innerHTML = rows.join('');
    </script>
  </body>
</html>
